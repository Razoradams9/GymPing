# Render settings for GymPing (free plan). Render reads this when you create a "Blueprint".
services:
  - type: web
    name: gymping
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GYMPING_HOSTED
        value: "1"
      # Send hours and dates follow Indian time.
      - key: TZ
        value: Asia/Kolkata
      # Render asks you for these when you create the service.
      - key: DATABASE_URL
        sync: false
      # Your own overseer login. New gyms wait for your approval.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
