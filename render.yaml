# Render settings for GymPing (free plan). Render reads this when you create a "Blueprint".
services:
  - type: web
    name: gymping
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GYMPING_HOSTED
        value: "1"
      # Your gym's time zone, so "9 AM" and "4 days before" mean your local time.
      # Names: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - key: TZ
        value: America/New_York
      # Leaves most of the small free server's memory for the WhatsApp browser.
      - key: NODE_OPTIONS
        value: --max-old-space-size=160
      # Render asks you for this when you create the service.
      - key: DATABASE_URL
        sync: false
      # No login by default: anyone with the address can use this GymPing.
      # To require a password, add GYMPING_PASSWORD in Render's Environment settings.
